<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription & Bill Reminder</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <style>
        :root {
            --color-bg: #ffffff;
            --color-surface: #f8f9fa;
            --color-border: #e5e7eb;
            --color-text: #1f2937;
            --color-text-secondary: #6b7280;
            --color-accent: #3b82f6;
            --color-success: #10b981;
            --color-warning: #f59e0b;
            --color-critical: #ef4444;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --color-bg: #111827;
                --color-surface: #1f2937;
                --color-border: #374151;
                --color-text: #f3f4f6;
                --color-text-secondary: #d1d5db;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--color-bg);
            color: var(--color-text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 16px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            gap: 16px;
            flex-wrap: wrap;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
        }

        button {
            padding: 8px 16px;
            border: 1px solid var(--color-border);
            background: var(--color-surface);
            color: var(--color-text);
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--color-border);
        }

        button.primary {
            background: var(--color-accent);
            color: white;
            border-color: var(--color-accent);
        }

        button.primary:hover {
            background: #2563eb;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--color-accent);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--color-text-secondary);
            text-transform: uppercase;
            font-weight: 600;
        }

        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 6px 12px;
            border: 1px solid var(--color-border);
            background: var(--color-surface);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }

        .filter-btn.active {
            background: var(--color-accent);
            color: white;
            border-color: var(--color-accent);
        }

        .subscriptions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .subscription-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-header {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .card-image {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            background: var(--color-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
        }

        .card-info h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .card-type {
            font-size: 12px;
            color: var(--color-text-secondary);
            background: var(--color-bg);
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            width: fit-content;
        }

        .card-details {
            display: grid;
            gap: 8px;
            font-size: 13px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
        }

        .detail-label {
            color: var(--color-text-secondary);
        }

        .detail-value {
            font-weight: 600;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            width: fit-content;
        }

        .status-critical {
            background: #fecaca;
            color: #991b1b;
        }

        .status-warning {
            background: #fef3c7;
            color: #92400e;
        }

        .status-success {
            background: #dcfce7;
            color: #166534;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-sm {
            flex: 1;
            padding: 6px 8px;
            font-size: 12px;
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            color: var(--color-text);
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-sm:hover {
            background: var(--color-border);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: 24px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 20px;
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--color-text-secondary);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            background: var(--color-bg);
            color: var(--color-text);
            font-family: inherit;
            font-size: 14px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .form-actions {
            display: flex;
            gap: 8px;
            margin-top: 24px;
        }

        .form-actions button {
            flex: 1;
        }

        .alert {
            display: none;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .alert.show {
            display: block;
        }

        .alert.success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .alert.error {
            background: #fecaca;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--color-text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 20px;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .subscriptions-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Subscriptions & Bills</h1>
            <button class="primary" id="addBtn">+ Add New</button>
        </header>

        <div class="alert" id="alert"></div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalSubscriptions">0</div>
                <div class="stat-label">Total Subscriptions</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="dueSoon">0</div>
                <div class="stat-label">Due This Week</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="monthlySpend">₹0</div>
                <div class="stat-label">Monthly Spend</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="overdueCount">0</div>
                <div class="stat-label">Overdue</div>
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="OTT">OTT</button>
            <button class="filter-btn" data-filter="Utility">Utilities</button>
            <button class="filter-btn" data-filter="LLM">AI/LLM</button>
        </div>

        <div id="subscriptionsList" class="subscriptions-grid"></div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Subscription</h2>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>
            <form id="subscriptionForm">
                <div class="form-group">
                    <label for="name">Name *</label>
                    <input type="text" id="name" placeholder="e.g., Netflix" required>
                </div>
                <div class="form-group">
                    <label for="category">Category *</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <optgroup label="OTT Platforms">
                            <option value="OTT">Netflix</option>
                            <option value="OTT">Prime Video</option>
                            <option value="OTT">Disney+</option>
                            <option value="OTT">Jio Savn</option>
                            <option value="OTT">Hotstar</option>
                            <option value="OTT">Sony Liv</option>
                            <option value="OTT">ZEE5</option>
                            <option value="OTT">Voot</option>
                            <option value="OTT">Other OTT</option>
                        </optgroup>
                        <optgroup label="Utilities">
                            <option value="Utility">Electricity Bill</option>
                            <option value="Utility">Water Bill</option>
                            <option value="Utility">Internet/Broadband</option>
                            <option value="Utility">Mobile Postpaid</option>
                            <option value="Utility">Gas Bill</option>
                            <option value="Utility">Other Utility</option>
                        </optgroup>
                        <optgroup label="AI/LLM">
                            <option value="LLM">Claude Pro</option>
                            <option value="LLM">ChatGPT Plus</option>
                            <option value="LLM">Other LLM</option>
                        </optgroup>
                    </select>
                </div>
                <div class="form-group">
                    <label for="subscriptionType">Subscription Type *</label>
                    <select id="subscriptionType" required>
                        <option value="Monthly">Monthly</option>
                        <option value="Yearly">Yearly</option>
                        <option value="Half-yearly">Half-yearly</option>
                        <option value="Quarterly">Quarterly</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="renewalDate">Renewal Date *</label>
                    <input type="date" id="renewalDate" required>
                </div>
                <div class="form-group">
                    <label for="cost">Monthly Cost (₹)</label>
                    <input type="number" id="cost" step="0.01" min="0" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label for="reminderDays">Reminder Days Before</label>
                    <input type="number" id="reminderDays" value="3" min="0" max="30">
                </div>
                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea id="notes" placeholder="Add any notes..." rows="3"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="primary" id="submitBtn">Add Subscription</button>
                    <button type="button" id="cancelBtn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let subscriptions = [];
        let currentEditId = null;
        let currentFilter = 'all';

        // Subscription logos/emojis
        const subscriptionLogos = {
            'Netflix': '🎬',
            'Prime Video': '🎥',
            'Disney+': '✨',
            'Jio Savn': '🎵',
            'Hotstar': '📺',
            'Sony Liv': '📽️',
            'ZEE5': '🎞️',
            'Voot': '📺',
            'Claude Pro': '🤖',
            'ChatGPT Plus': '💬',
            'Electricity Bill': '⚡',
            'Water Bill': '💧',
            'Internet/Broadband': '🌐',
            'Mobile Postpaid': '📱',
            'Gas Bill': '🔥'
        };

        async function fetchSubscriptions(filter = 'all') {
            try {
                const url = filter === 'all' ? `${API_BASE}/subscriptions` : `${API_BASE}/subscriptions?filter=${filter}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to fetch');
                return await response.json();
            } catch (error) {
                console.error('Error:', error);
                showAlert('Error loading subscriptions', 'error');
                return [];
            }
        }

        async function fetchStats() {
            try {
                const response = await fetch(`${API_BASE}/stats`);
                if (!response.ok) throw new Error('Failed to fetch');
                return await response.json();
            } catch (error) {
                console.error('Error:', error);
                return null;
            }
        }

        async function createSubscription(data) {
            try {
                const response = await fetch(`${API_BASE}/subscriptions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'Failed to create');
                }
                return await response.json();
            } catch (error) {
                console.error('Error:', error);
                showAlert('Error: ' + error.message, 'error');
                return null;
            }
        }

        async function updateSubscription(id, data) {
            try {
                const response = await fetch(`${API_BASE}/subscriptions/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (!response.ok) throw new Error('Failed to update');
                return await response.json();
            } catch (error) {
                console.error('Error:', error);
                showAlert('Error updating subscription', 'error');
                return null;
            }
        }

        async function deleteSubscription(id) {
            if (!confirm('Are you sure you want to delete this subscription?')) return;
            try {
                const response = await fetch(`${API_BASE}/subscriptions/${id}`, {
                    method: 'DELETE'
                });
                if (!response.ok) throw new Error('Failed to delete');
                showAlert('Subscription deleted', 'success');
                await loadData();
            } catch (error) {
                console.error('Error:', error);
                showAlert('Error deleting subscription', 'error');
            }
        }

        function showAlert(message, type = 'success') {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert show ${type}`;
            setTimeout(() => alert.classList.remove('show'), 3000);
        }

        function openModal(id = null) {
            currentEditId = id;
            const form = document.getElementById('subscriptionForm');
            form.reset();
            document.getElementById('modalTitle').textContent = id ? 'Edit Subscription' : 'Add New Subscription';
            document.getElementById('submitBtn').textContent = id ? 'Update' : 'Add Subscription';
            document.getElementById('modal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('show');
            currentEditId = null;
        }

        function getStatusInfo(daysLeft) {
            if (daysLeft < 0) {
                return { class: 'status-critical', text: `${Math.abs(daysLeft)}d Overdue` };
            } else if (daysLeft <= 3) {
                return { class: 'status-warning', text: `${daysLeft}d Left` };
            }
            return { class: 'status-success', text: `${daysLeft}d Left` };
        }

        async function renderSubscriptions() {
            const subs = await fetchSubscriptions(currentFilter);
            const container = document.getElementById('subscriptionsList');

            if (subs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <div class="empty-state-icon">📭</div>
                        <p>No subscriptions found. Click "Add New" to get started!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = subs.map(sub => {
                const daysLeft = sub.days_left;
                const statusInfo = getStatusInfo(daysLeft);
                const logo = subscriptionLogos[sub.name] || '🎫';
                const renewalDate = new Date(sub.renewal_date).toLocaleDateString('en-IN');

                return `
                    <div class="subscription-card">
                        <div class="card-header">
                            <div class="card-image">${logo}</div>
                            <div class="card-info">
                                <h3>${sub.name}</h3>
                                <span class="card-type">${sub.subscription_type}</span>
                            </div>
                        </div>
                        <div class="card-details">
                            <div class="detail-row">
                                <span class="detail-label">Category:</span>
                                <span class="detail-value">${sub.category}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Cost:</span>
                                <span class="detail-value">₹${sub.cost.toFixed(2)}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Renewal:</span>
                                <span class="detail-value">${renewalDate}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Status:</span>
                                <span class="status-badge ${statusInfo.class}">${statusInfo.text}</span>
                            </div>
                        </div>
                        <div class="card-actions">
                            <button class="btn-sm" onclick="openModal(${sub.id})">Edit</button>
                            <button class="btn-sm" onclick="deleteSubscription(${sub.id})">Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function updateStats() {
            const stats = await fetchStats();
            if (stats) {
                document.getElementById('totalSubscriptions').textContent = stats.total_subscriptions;
                document.getElementById('dueSoon').textContent = stats.due_soon;
                document.getElementById('monthlySpend').textContent = `₹${stats.monthly_spend.toFixed(0)}`;
                document.getElementById('overdueCount').textContent = stats.overdue;
            }
        }

        async function loadData() {
            await renderSubscriptions();
            await updateStats();
        }

        // Event Listeners
        document.getElementById('addBtn').addEventListener('click', () => openModal());
        document.getElementById('closeModal').addEventListener('click', closeModal);
        document.getElementById('cancelBtn').addEventListener('click', closeModal);

        document.getElementById('subscriptionForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                name: document.getElementById('name').value,
                category: document.getElementById('category').value,
                renewal_date: document.getElementById('renewalDate').value,
                subscription_type: document.getElementById('subscriptionType').value,
                cost: parseFloat(document.getElementById('cost').value) || 0,
                reminder_days: parseInt(document.getElementById('reminderDays').value) || 3,
                notes: document.getElementById('notes').value
            };

            if (currentEditId) {
                const result = await updateSubscription(currentEditId, data);
                if (result?.success) showAlert('Updated successfully', 'success');
            } else {
                const result = await createSubscription(data);
                if (result?.success) showAlert('Added successfully', 'success');
            }

            closeModal();
            await loadData();
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.dataset.filter;
                renderSubscriptions();
            });
        });

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });

        // Initial load
        loadData();
        setInterval(loadData, 30000);
    </script>
</body>
</html>
